<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Dar Al Fikr · Grade 4 Mathematics Hub</title>
  <meta name="description" content="The Dar Al Fikr Grade 4 Mathematics Learning Hub: lessons, pacing, the Wadi al-Amanah map, classroom games, gates and student portfolios." />
  <meta name="theme-color" content="#f3f7f8" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#061114" media="(prefers-color-scheme: dark)" />
  <meta property="og:title" content="Dar Al Fikr · Grade 4 Mathematics Hub" />
  <meta property="og:description" content="Lessons, pacing, games and portfolios for enVision Grade 4 Mathematics." />
  <meta property="og:image" content="/assets/img/daf-logo.png" />
  <link rel="icon" type="image/png" href="/assets/img/daf-star.png" />
  <link rel="apple-touch-icon" href="/assets/img/daf-star.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { var t = localStorage.getItem("daf.hub.theme"); if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,400&family=Space+Mono:wght@400;700&display=swap" />
  <link rel="stylesheet" href="/assets/css/hub.css" />
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>

  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <a class="brand" href="#/dashboard">
        <span class="brand-mark"><img src="/assets/img/daf-star.png" alt="" width="30" height="30" /></span>
        <span>
          <span class="brand-name">Dar Al Fikr Schools</span><br />
          <span class="brand-sub">Grade 4 Mathematics Hub</span>
        </span>
      </a>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <div class="motto">Faith, Righteousness and Wisdom</div>
        <div class="motto-ar" lang="ar">الإيمان والاستقامة والحكمة</div>
      </div>
    </aside>
    <div class="scrim" id="scrim" aria-hidden="true"></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn burger" id="burger" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="crumb" id="crumb" aria-live="polite"></div>
        <div class="topbar-spacer"></div>
        <button class="search-trigger" id="search" aria-label="Search lessons and pages" aria-keyshortcuts="Control+K Meta+K /">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <span>Search lessons…</span>
          <kbd>Ctrl K</kbd>
        </button>
        <button class="icon-btn" id="theme" aria-label="Toggle dark mode">
          <svg class="ico theme-light-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="ico theme-dark-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </header>

      <main class="page" id="view" tabindex="-1">
        <div class="skeleton" aria-label="Loading"><span></span><span></span><span></span></div>
      </main>
    </div>
  </div>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <noscript>
    <p style="padding:24px;font-family:system-ui">This hub needs JavaScript. Please enable it to browse lessons.</p>
  </noscript>

  <script src="/assets/js/hub.js" defer></script>
</body>
</html>
